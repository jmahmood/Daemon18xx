<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daemon18xx - 1889 Multiplayer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Apple HIG inspired design system */
    :root {
      --primary-color: #007aff;
      --success-color: #34c759;
      --warning-color: #ff9500;
      --danger-color: #ff3b30;
      --background-primary: #1a1a1a;
      --background-secondary: #2a2a2a;
      --background-tertiary: #3a3a3a;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --border-color: #404040;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    button {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #0051d5;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
    }

    input, select {
      background: var(--background-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    /* Auction Component */
    .auction-container {
      padding: 20px;
      height: 100%;
      overflow-y: auto;
    }

    .auction-header {
      margin-bottom: 30px;
    }

    .auction-header h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .auction-header .instruction {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .company-section {
      margin-bottom: 20px;
    }

    .company-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .company-card {
      background: var(--background-tertiary);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      transition: all 0.2s;
    }

    .company-card:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .company-card.unaffordable {
      opacity: 0.5;
    }

    .company-card.sold {
      border-color: var(--success-color);
      opacity: 0.7;
    }

    .company-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .company-short-name {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary-color);
    }

    .company-cost {
      font-size: 18px;
      font-weight: bold;
      color: var(--success-color);
    }

    .company-name {
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .company-revenue {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .company-owner {
      font-size: 13px;
      color: var(--success-color);
      font-weight: 500;
    }

    .buy-company-btn {
      width: 100%;
      padding: 8px;
      font-size: 13px;
    }

    /* Auction Action Buttons */
    .action-buttons {
      display: flex;
      gap: 5px;
      margin-top: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 8px;
      font-size: 12px;
      border-radius: 6px;
      font-weight: 500;
    }

    .buy-btn {
      background: var(--success-color);
    }

    .buy-btn:hover:not(:disabled) {
      background: #2fb04a;
    }

    .pass-btn {
      background: var(--text-secondary);
    }

    .pass-btn:hover {
      background: #8f8f8f;
    }

    .bid-btn {
      background: var(--warning-color);
    }

    .bid-btn:hover:not(:disabled) {
      background: #e08700;
    }

    .current-company {
      border-color: var(--warning-color) !important;
      box-shadow: 0 0 15px rgba(255, 149, 0, 0.3);
    }

    .current-badge {
      background: var(--warning-color);
      color: white;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      margin-bottom: 8px;
      text-align: center;
    }

    /* Header Player Name Display */
    .player-name-display {
      background: var(--background-tertiary);
      padding: 8px 16px;
      border-radius: 8px;
      margin-right: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .player-label {
      color: var(--text-secondary);
      font-size: 12px;
      font-weight: 500;
    }

    .player-name {
      color: var(--primary-color);
      font-size: 14px;
      font-weight: 700;
    }

    /* Stock Round Styles */
    .stock-round-container {
      padding: 20px;
      height: 100%;
      overflow-y: auto;
    }

    .stock-round-header {
      margin-bottom: 30px;
    }

    .stock-round-header h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .stock-round-header .instruction {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .companies-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
      margin: 20px 0;
    }

    .company-card.not-started {
      border-color: var(--warning-color);
    }

    .company-card.floated {
      border-color: var(--success-color);
    }

    .stock-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .stock-btn {
      flex: 1;
      min-width: 120px;
      padding: 8px 12px;
      font-size: 13px;
      border-radius: 6px;
    }

    .buy-stock-btn {
      background: var(--success-color);
    }

    .buy-stock-btn:hover:not(:disabled) {
      background: #2fb04a;
    }

    .sell-stock-btn {
      background: var(--danger-color);
    }

    .sell-stock-btn:hover:not(:disabled) {
      background: #e63329;
    }

    .start-company-btn {
      background: var(--warning-color);
      width: 100%;
    }

    .start-company-btn:hover:not(:disabled) {
      background: #e08700;
    }

    .holdings-panel {
      background: var(--background-secondary);
      border-radius: 12px;
      padding: 20px;
      margin: 20px 0;
    }

    .holdings-panel h3 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .holding-item {
      padding: 10px;
      margin: 8px 0;
      background: var(--background-tertiary);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .president-badge {
      background: var(--warning-color);
      color: white;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: bold;
      margin-left: 8px;
      display: inline-block;
    }

    .action-panel {
      background: var(--background-secondary);
      border-radius: 12px;
      padding: 20px;
    }

    .action-panel h3 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .action-buttons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
    }

    .action-btn-large {
      padding: 15px 20px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
    }

    .pass-action-btn {
      background: var(--text-secondary);
    }

    .pass-action-btn:hover {
      background: #8f8f8f;
    }

    /* Modal Styles */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(4px);
    }

    .modal {
      background: var(--background-secondary);
      border-radius: 16px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
    }

    .modal-header {
      padding: 20px;
      border-bottom: 1px solid var(--border-color);
    }

    .modal-title {
      font-size: 20px;
      font-weight: 600;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-footer {
      padding: 20px;
      border-top: 1px solid var(--border-color);
      display: flex;
      gap: 10px;
      justify-content: flex-end;
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 500;
      color: var(--text-primary);
    }

    .form-input {
      width: 100%;
      background: var(--background-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    /* Checkbox styling for sell modal */
    input[type="checkbox"] {
      width: 18px;
      height: 18px;
      cursor: pointer;
      accent-color: var(--primary-color);
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading" style="display: flex; align-items: center; justify-content: center; height: 100vh;">
      <p style="font-size: 18px;">Loading Daemon18xx...</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
