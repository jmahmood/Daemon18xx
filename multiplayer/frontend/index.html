<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daemon18xx - 1889 Multiplayer</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: #1a1a1a;
      color: #e0e0e0;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Apple HIG inspired design system */
    :root {
      --primary-color: #007aff;
      --success-color: #34c759;
      --warning-color: #ff9500;
      --danger-color: #ff3b30;
      --background-primary: #1a1a1a;
      --background-secondary: #2a2a2a;
      --background-tertiary: #3a3a3a;
      --text-primary: #e0e0e0;
      --text-secondary: #a0a0a0;
      --border-color: #404040;
      --shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
    }

    button {
      background: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }

    button:hover {
      background: #0051d5;
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    button:disabled {
      background: #555;
      cursor: not-allowed;
      transform: none;
    }

    input, select {
      background: var(--background-tertiary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 10px;
      border-radius: 8px;
      font-size: 14px;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--primary-color);
    }

    /* Auction Component */
    .auction-container {
      padding: 20px;
      height: 100%;
      overflow-y: auto;
    }

    .auction-header {
      margin-bottom: 30px;
    }

    .auction-header h2 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .auction-header .instruction {
      color: var(--text-secondary);
      font-size: 14px;
    }

    .company-section {
      margin-bottom: 20px;
    }

    .company-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 15px;
    }

    .company-card {
      background: var(--background-tertiary);
      border: 2px solid var(--border-color);
      border-radius: 12px;
      padding: 15px;
      transition: all 0.2s;
    }

    .company-card:hover {
      border-color: var(--primary-color);
      transform: translateY(-2px);
      box-shadow: var(--shadow);
    }

    .company-card.unaffordable {
      opacity: 0.5;
    }

    .company-card.sold {
      border-color: var(--success-color);
      opacity: 0.7;
    }

    .company-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .company-short-name {
      font-size: 20px;
      font-weight: bold;
      color: var(--primary-color);
    }

    .company-cost {
      font-size: 18px;
      font-weight: bold;
      color: var(--success-color);
    }

    .company-name {
      font-size: 14px;
      margin-bottom: 8px;
      color: var(--text-primary);
    }

    .company-revenue {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
    }

    .company-owner {
      font-size: 13px;
      color: var(--success-color);
      font-weight: 500;
    }

    .buy-company-btn {
      width: 100%;
      padding: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="loading" style="display: flex; align-items: center; justify-content: center; height: 100vh;">
      <p style="font-size: 18px;">Loading Daemon18xx...</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
