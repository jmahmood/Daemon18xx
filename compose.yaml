services:
  backend:
    image: daemon18xx-backend
    build: .
    ports:
      - "127.0.0.1:${DAEMON18XX_PORT:-8000}:8000"
    environment:
      DAEMON18XX_DATABASE: ${DAEMON18XX_DATABASE:-/data/games.sqlite3}
      DAEMON18XX_CORS_ORIGINS: ${DAEMON18XX_CORS_ORIGINS:-}
    volumes:
      - games:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

volumes:
  games:
